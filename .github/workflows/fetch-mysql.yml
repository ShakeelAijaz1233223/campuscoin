# One-off infrastructure bootstrap: this sandbox cannot reach cdn.mysql.com,
# so a GitHub-hosted runner (which has open egress) fetches the official
# minimal MySQL distribution and commits it to this branch so the API can be
# started and verified end to end. The artifact is removed from the branch tip
# immediately after extraction and is never referenced by application code.
name: Fetch MySQL runtime artifact
on:
  push:
    branches:
      - arena/01a0e423-campuscoin
    paths:
      - '.github/workflows/fetch-mysql.yml'
permissions:
  contents: write
concurrency:
  group: fetch-mysql-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download official minimal MySQL distribution
        run: |
          set -euo pipefail
          urls=(
            "https://cdn.mysql.com//Downloads/MySQL-8.0/mysql-8.0.43-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://cdn.mysql.com//Downloads/MySQL-8.0/mysql-8.0.42-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://cdn.mysql.com//Downloads/MySQL-8.0/mysql-8.0.40-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://cdn.mysql.com//Downloads/MySQL-8.4/mysql-8.4.7-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://cdn.mysql.com//Downloads/MySQL-8.4/mysql-8.4.6-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://dev.mysql.com/get/Downloads/MySQL-8.0/mysql-8.0.43-linux-glibc2.28-x86_64-minimal.tar.xz"
          )
          for attempt in 1 2 3; do
            for u in "${urls[@]}"; do
              echo "Attempt $attempt probing $u"
              if curl -fsIL --retry 3 --retry-all-errors --max-time 60 "$u" >/dev/null 2>&1; then
                if curl -fL --retry 5 --retry-all-errors --max-time 900 -o mysql.tar.xz "$u"; then
                  echo "::notice::downloaded $u"
                  break 2
                fi
              fi
            done
            sleep $((attempt * 10))
          done
          test -s mysql.tar.xz || { echo '::error::No candidate URL succeeded'; exit 1; }
          sha256sum mysql.tar.xz
          size=$(stat -c%s mysql.tar.xz)
          echo "::notice::artifact bytes: $size"
          if [ "$size" -ge 90000000 ]; then
            echo 'Artifact too large for a git blob; repacking a slim server-only distribution'
            rm -rf slim && mkdir slim
            tar -xJf mysql.tar.xz -C slim --strip-components=1 \
              bin/mysqld bin/mysql bin/mysqldump bin/mysqladmin bin/mysqlshow bin/mysqlbinlog \
              share
            tar -cJf mysql-slim.tar.xz -C slim .
            mv mysql-slim.tar.xz mysql.tar.xz
            sha256sum mysql.tar.xz
            stat -c%s mysql.tar.xz
          fi
      - name: Commit artifact via GitHub git data API
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import base64, json, os, datetime
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          ref = os.environ['GITHUB_REF_NAME']
          api = 'https://api.github.com/repos/' + repo

          def call(method, path, payload=None, raw=None):
              data = None
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'}
              if raw is not None:
                  data = raw
                  headers['Content-Type'] = 'application/octet-stream'
              elif payload is not None:
                  data = json.dumps(payload).encode()
                  headers['Content-Type'] = 'application/json'
              req = Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urlopen(req) as resp:
                      body = resp.read()
                  return json.loads(body) if body else {}
              except HTTPError as e:
                  print('::error::' + path + ' -> HTTP ' + str(e.code) + ' ' + e.read().decode()[:400])
                  raise

          content = open('mysql.tar.xz', 'rb').read()
          print('::notice::artifact bytes: ' + str(len(content)))
          blob = call('POST', '/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
          print('::notice::blob uploaded ' + blob['sha'])
          base_sha = call('GET', '/git/ref/heads/' + ref)['object']['sha']
          base_tree = call('GET', '/git/commits/' + base_sha)['tree']['sha']
          tree = call('POST', '/git/trees', {'base_tree': base_tree, 'tree': [
              {'path': '.arena-artifacts/mysql-minimal.tar.xz', 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}
          ]})
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          commit = call('POST', '/git/commits', {
              'message': 'chore(infra): stage MySQL runtime artifact for sandbox verification [skip ci]',
              'tree': tree['sha'], 'parents': [base_sha],
              'author': {'name': 'arena-infra-relay', 'email': '41898282+github-actions[bot]@users.noreply.github.com', 'date': now}
          })
          print('::notice::commit created ' + commit['sha'])
          call('PATCH', '/git/refs/heads/' + ref, {'sha': commit['sha'], 'force': False})
          print('::notice::ref updated; relay complete')
