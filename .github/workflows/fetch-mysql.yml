# One-off infrastructure bootstrap: this sandbox cannot reach cdn.mysql.com,
# so a GitHub-hosted runner (which has open egress) fetches the official
# minimal MySQL distribution and commits it to this branch so the API can be
# started and verified end to end. The artifact is removed from the branch tip
# immediately after extraction and is never referenced by application code.
name: Fetch MySQL runtime artifact
on:
  push:
    branches:
      - arena/01a0e423-campuscoin
    paths:
      - '.github/workflows/fetch-mysql.yml'
permissions:
  contents: write
concurrency:
  group: fetch-mysql-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download official minimal MySQL distribution
        run: |
          set -euo pipefail
          urls=(
            "https://cdn.mysql.com//Downloads/MySQL-8.0/mysql-8.0.43-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://cdn.mysql.com//Downloads/MySQL-8.0/mysql-8.0.42-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://cdn.mysql.com//Downloads/MySQL-8.0/mysql-8.0.40-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://cdn.mysql.com//Downloads/MySQL-8.4/mysql-8.4.7-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://cdn.mysql.com//Downloads/MySQL-8.4/mysql-8.4.6-linux-glibc2.28-x86_64-minimal.tar.xz"
            "https://dev.mysql.com/get/Downloads/MySQL-8.0/mysql-8.0.43-linux-glibc2.28-x86_64-minimal.tar.xz"
          )
          for attempt in 1 2 3; do
            for u in "${urls[@]}"; do
              echo "Attempt $attempt probing $u"
              if curl -fsIL --retry 3 --retry-all-errors --max-time 60 "$u" >/dev/null 2>&1; then
                if curl -fL --retry 5 --retry-all-errors --max-time 900 -o mysql.tar.xz "$u"; then
                  echo "::notice::downloaded $u"
                  break 2
                fi
              fi
            done
            sleep $((attempt * 10))
          done
          test -s mysql.tar.xz || { echo '::error::No candidate URL succeeded'; exit 1; }
          sha256sum mysql.tar.xz
          size=$(stat -c%s mysql.tar.xz)
          echo "::notice::artifact bytes: $size"
          if [ "$size" -ge 90000000 ]; then
            echo 'Artifact too large for a git blob; repacking a slim server-only distribution'
            rm -rf slim && mkdir slim
            tar -xJf mysql.tar.xz -C slim --strip-components=1 \
              bin/mysqld bin/mysql bin/mysqldump bin/mysqladmin bin/mysqlshow bin/mysqlbinlog \
              share
            tar -cJf mysql-slim.tar.xz -C slim .
            mv mysql-slim.tar.xz mysql.tar.xz
            sha256sum mysql.tar.xz
            stat -c%s mysql.tar.xz
          fi
      - name: Commit artifact via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::notice::step: begin api commit; bytes=$(stat -c%s mysql.tar.xz)"
          B64=$(base64 -w0 mysql.tar.xz)
          echo "::notice::step: base64 length ${#B64}"
          BLOB_SHA=$(echo "{\"content\":\"$B64\",\"encoding\":\"base64\"}" | curl -sf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs --data @- | python3 -c "import json,sys;print(json.load(sys.stdin)['sha'])")
          echo "::notice::step: blob uploaded $BLOB_SHA"
          REF=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME})
          BASE_SHA=$(echo "$REF" | python3 -c "import json,sys;print(json.load(sys.stdin)['object']['sha'])")
          BASE_TREE=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/$BASE_SHA | python3 -c "import json,sys;print(json.load(sys.stdin)['tree']['sha'])")
          echo "::notice::step: base $BASE_SHA tree $BASE_TREE"
          TREE_SHA=$(curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/trees --data @- <<EOF | python3 -c "import json,sys;print(json.load(sys.stdin)['sha'])"
          {"base_tree":"$BASE_TREE","tree":[{"path":".arena-artifacts/mysql-minimal.tar.xz","mode":"100644","type":"blob","sha":"$BLOB_SHA"}]}
EOF
          )
          echo "::notice::step: tree created $TREE_SHA"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_SHA=$(curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits --data @- <<EOF | python3 -c "import json,sys;print(json.load(sys.stdin)['sha'])"
          {"message":"chore(infra): stage MySQL runtime artifact for sandbox verification [skip ci]","tree":"$TREE_SHA","parents":["$BASE_SHA"],"author":{"name":"arena-infra-relay","email":"41898282+github-actions[bot]@users.noreply.github.com","date":"$NOW"}}
EOF
          )
          echo "::notice::step: commit created $COMMIT_SHA"
          curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}/sha --data "{\"sha\":\"$COMMIT_SHA\"}" >/dev/null
          echo "::notice::step: ref updated"
